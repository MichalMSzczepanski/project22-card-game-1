# Tests always get a fresh, ephemeral in-memory DB — never touch the persistent
# file-based DB from application.properties (that one is for the real app/dev use).
spring.datasource.url=jdbc:h2:mem:testdb-${random.uuid};DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false


spring.h2.console.enabled=false

logging.level.root=INFO
logging.level.io.github.michalmszczepanski.project22_card_game_1=DEBUG
