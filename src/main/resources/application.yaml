spring:
  application:
    name: project22-card-game-1

  # File-based H2. Swapping to Postgres later is a config-only change: same JPA
  # entities/repositories, just point these 4 lines at Postgres
  # (url/driver-class-name/username/password) and flip ddl-auto to "validate"
  # behind a real migration tool (e.g. Flyway) instead — see TODO (docker-compose + Postgres).
  datasource:
    url: jdbc:h2:file:./data/carddb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      # TEMPORARY while the schema is still changing often: wipes and recreates on every
      # start, so game/account data does NOT survive a restart right now (trade-off, not a
      # bug — avoids the ALTER-TABLE-NOT-NULL pitfall in README § "Znana pułapka"). Revert to
      # "update" (or "validate" + Flyway on Postgres) once the schema has settled.
      ddl-auto: create-drop
    open-in-view: false

  # Sessions in the same DB too (survives a restart on their own — originally meant a
  # restart didn't log everyone out while game data also survived; that second half is
  # moot for now with ddl-auto=create-drop above, see the TODO on that line). Wiring is in
  # SessionConfig (@EnableJdbcHttpSession) since Boot 4.x no longer auto-configures
  # this from a property. Schema is our own idempotent copy (see session-schema-h2.sql)
  # so repeated restarts don't fail trying to re-create existing tables.
  session:
    timeout: 8h
  sql:
    init:
      mode: always
      schema-locations: classpath:session-schema-h2.sql

  # H2 console is off by default (OWASP A05: an unauthenticated SQL console on a
  # running app is a serious exposure). Run with --spring.profiles.active=dev
  # locally (see application-dev.yaml) to turn it on.
  h2:
    console:
      enabled: false

  # --- OAuth2 social login (optional) ---------------------------------------
  # Unconfigured by default: with no registration below, no ClientRegistrationRepository
  # bean exists and SecurityConfig skips oauth2Login() entirely (password login still works).
  # Fill in real credentials (e.g. via env vars) and restart to turn Google login on;
  # Facebook works the same way once Spring's CommonOAuth2Provider defaults apply —
  # no code changes needed (see CustomOAuth2UserService).
  # security:
  #   oauth2:
  #     client:
  #       registration:
  #         google:
  #           client-id: ${GOOGLE_CLIENT_ID}
  #           client-secret: ${GOOGLE_CLIENT_SECRET}
  #           scope: openid,profile,email
  #         facebook:
  #           client-id: ${FACEBOOK_CLIENT_ID}
  #           client-secret: ${FACEBOOK_CLIENT_SECRET}
  #           scope: email,public_profile

logging:
  level:
    root: INFO
    io.github.michalmszczepanski.project22_card_game_1: DEBUG

# Game rules — see GameProperties. Change here instead of recompiling (e.g. to
# raise player count before ROADMAP.md's "do 10 graczy" lands in code).
game:
  players:
    min: 3
    max: 5
  hand-size: 7
  # Ceiling only — the host picks the actual round count (1..max-total-rounds) when creating the game.
  max-total-rounds: 20
  timeouts:
    answer-seconds: 60
    ranking-seconds: 45
    # How long only the round's leader can click "Next round" before it opens up to everyone else.
    reveal-seconds: 30
    # 60s, not a stricter value — a phone screen locking/dimming is normal and shouldn't boot someone
    # from the game. A player currently expected to act is exempt from this regardless (see GameService).
    disconnect-seconds: 60
    leave-banner-seconds: 10
  max-nickname-length: 20
  code-length: 5
  poll-interval-seconds: 3
  scoring:
    podium-size: 3
    podium-points: [3, 2, 1]

# Account/registration rules — see UserProperties.
user:
  min-username-length: 3
  max-username-length: 30
  min-password-length: 8
