<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Zgłoszone karty — panel admina</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f5f7; }
    </style>
</head>
<body>
<div class="container py-4" style="max-width: 760px;">

<div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h4 mb-0">Zgłoszone karty</h1>
    <a href="/admin" class="btn btn-sm btn-outline-secondary">&larr; Dashboard</a>
</div>

<div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
<div class="alert alert-success" th:if="${info}" th:text="${info}"></div>

<div class="card shadow-sm mb-3" th:each="r : ${reports}">
    <div class="card-body">
        <p class="text-muted small mb-1">
            <span th:text="${r.cardType().name() == 'QUESTION'} ? 'Pytanie' : 'Odpowiedź'"></span>
            &middot; pakiet <strong th:text="${r.packName()}"></strong>
        </p>
        <p class="card-text" th:text="${r.cardText()}"></p>
        <p class="small text-muted mb-2">
            zgłosił(a): <strong th:text="${r.reporterNickname()}"></strong>
            <span th:if="${r.note() != null}"> — „<span th:text="${r.note()}"></span>”</span>
        </p>

        <div class="d-flex gap-2 flex-wrap">
            <form method="post" th:action="@{/admin/reports/{id}/remove(id=${r.cardId()})}"
                  onsubmit="return confirm('Wyłączyć tę kartę? Przestanie być rozdawana w nowych grach.');">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-sm btn-outline-danger">Usuń (wyłącz)</button>
            </form>

            <form method="post" th:action="@{/admin/reports/{id}/fix(id=${r.cardId()})}" class="d-flex gap-1">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="text" name="text" class="form-control form-control-sm" th:value="${r.cardText()}" maxlength="500" required>
                <button type="submit" class="btn btn-sm btn-outline-primary">Popraw</button>
            </form>

            <form method="post" th:action="@{/admin/reports/{id}/dismiss(id=${r.reportId()})}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-sm btn-outline-secondary">Odrzuć zgłoszenie</button>
            </form>
        </div>
    </div>
</div>

<p class="text-muted text-center" th:if="${reports.isEmpty()}">Brak zgłoszeń — wszystko czyste.</p>

</div>
</body>
</html>
