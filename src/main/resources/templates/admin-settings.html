<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Ustawienia serwisu — panel admina</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f5f7; }
    </style>
</head>
<body>
<div class="container py-4" style="max-width: 560px;">

<div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h4 mb-0">Ustawienia serwisu</h1>
    <a href="/admin" class="btn btn-sm btn-outline-secondary">&larr; Dashboard</a>
</div>

<div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
<div class="alert alert-success" th:if="${info}" th:text="${info}"></div>

<form method="post" action="/admin/settings" class="card card-body shadow-sm">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

    <div class="form-check mb-3">
        <input type="checkbox" name="maintenanceMode" value="true" class="form-check-input" id="maintenanceMode"
               th:checked="${settings.maintenanceMode()}">
        <label class="form-check-label" for="maintenanceMode">
            <strong>Tryb serwisowy</strong> — blokuje tworzenie nowych gier (i rewanżów), baner widoczny dla wszystkich
        </label>
    </div>

    <label class="form-label small text-muted mb-1" for="announcementBanner">Baner ogłoszeń (widoczny wszystkim — na stronie głównej i w grze; puste = brak)</label>
    <textarea id="announcementBanner" name="announcementBanner" class="form-control mb-3" maxlength="500"
              rows="2" th:text="${settings.announcementBanner()}"></textarea>

    <label class="form-label small text-muted mb-1" for="maxActiveGamesOverride">Limit aktywnych gier (puste = domyślny z application.yaml)</label>
    <input type="number" id="maxActiveGamesOverride" name="maxActiveGamesOverride" class="form-control mb-3" min="1"
           th:value="${settings.maxActiveGamesOverride()}">

    <div class="form-check mb-2">
        <input type="checkbox" name="blankCardEnabled" value="true" class="form-check-input" id="blankCardEnabled"
               th:checked="${settings.blankCardEnabled()}">
        <label class="form-check-label" for="blankCardEnabled">Pusta karta (własna odpowiedź gracza, raz na grę)</label>
    </div>

    <div class="form-check mb-3">
        <input type="checkbox" name="comingSoonBadgeEnabled" value="true" class="form-check-input" id="comingSoonBadgeEnabled"
               th:checked="${settings.comingSoonBadgeEnabled()}">
        <label class="form-check-label" for="comingSoonBadgeEnabled">Baner „wkrótce” na płatnych pakietach (/packs)</label>
    </div>

    <button type="submit" class="btn btn-primary">Zapisz ustawienia</button>
</form>

</div>
</body>
</html>
