<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Moje konto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f5f7; }
    </style>
</head>
<body>
<div class="container py-4" style="max-width: 480px;">
<div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h4 mb-0">Moje konto</h1>
    <a href="/">&larr; Wróć do gry</a>
</div>

<div class="alert alert-success" th:if="${info}" th:text="${info}"></div>

<div class="card shadow-sm mb-3">
    <div class="card-body">
        <p class="mb-1">Zalogowany jako <strong th:text="${username}"></strong></p>
        <p class="mb-0"><a th:href="@{/me/proposals}">Moje propozycje kart</a></p>
    </div>
</div>

<div class="card shadow-sm border-danger">
    <div class="card-body">
        <h2 class="h6">Usuń konto</h2>
        <p class="small text-muted">Usuwa login, hasło, historię wyników i Twoje propozycje kart. Nieodwracalne.
            Zobacz <a th:href="@{/polityka-prywatnosci}">politykę prywatności</a>.</p>
        <form method="post" th:action="@{/me/account/delete}" onsubmit="return confirm('Usunąć konto bezpowrotnie?');">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn btn-outline-danger">Usuń moje konto</button>
        </form>
    </div>
</div>
</div>
</body>
</html>
