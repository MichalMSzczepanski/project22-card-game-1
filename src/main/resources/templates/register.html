<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rejestracja</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f5f7; }
    </style>
</head>
<body>
<div class="container py-4" style="max-width: 420px;">
<h1 class="text-center mb-4">Rejestracja</h1>

<div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

<div class="card shadow-sm">
    <div class="card-body">
        <form method="post" th:action="@{/register}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="text" class="form-control mb-2" name="username" placeholder="Login" required maxlength="30">
            <input type="password" class="form-control mb-3" name="password" placeholder="Hasło" required minlength="6">
            <button type="submit" class="btn btn-primary btn-lg w-100">Zarejestruj się</button>
        </form>
    </div>
</div>

<p class="text-center mt-3">Masz już konto? <a th:href="@{/login}">Zaloguj się</a></p>
</div>
</body>
</html>
