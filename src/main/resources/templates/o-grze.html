<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>O grze</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f5f7; }
    </style>
</head>
<body>
<div class="container py-4" style="max-width: 480px;">
<p><a th:href="@{/}">&larr; Wróć</a></p>
<h1 class="mb-3">O grze</h1>

<div class="card shadow-sm mb-3">
    <div class="card-body">
        <h2 class="h5">Darmowa</h2>
        <p class="mb-0">Gra jest w pełni darmowa. Nie ma kont, logowania ani zakupów.</p>
    </div>
</div>

<div class="card shadow-sm mb-3">
    <div class="card-body">
        <h2 class="h5">Dane</h2>
        <p class="mb-0">Nie zbieramy danych osobowych — podajesz tylko nick, który istnieje wyłącznie na czas gry.</p>
    </div>
</div>

<div class="card shadow-sm mb-3">
    <div class="card-body">
        <h2 class="h5">Treści</h2>
        <p class="mb-0">Niektóre pakiety kart zawierają treści 18+. Włącz tryb rodzinny przy tworzeniu gry, żeby je odfiltrować.</p>
    </div>
</div>
</div>
</body>
</html>
