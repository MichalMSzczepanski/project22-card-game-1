<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Moje propozycje kart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f5f7; }
    </style>
</head>
<body>
<div class="container py-4" style="max-width: 560px;">

<div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h4 mb-0">Moje propozycje kart</h1>
    <a href="/">&larr; Wróć do gry</a>
</div>

<div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
<div class="alert alert-success" th:if="${info}" th:text="${info}"></div>

<form method="post" action="/me/proposals" class="card card-body shadow-sm mb-4">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <label class="form-label small text-muted mb-1">Zaproponuj kartę</label>
    <div class="row g-2">
        <div class="col-8">
            <input type="text" name="text" class="form-control" placeholder="Tekst karty" maxlength="500" required>
        </div>
        <div class="col-4">
            <select name="type" class="form-select">
                <option value="ANSWER">Odpowiedź</option>
                <option value="QUESTION">Pytanie</option>
            </select>
        </div>
    </div>
    <button type="submit" class="btn btn-primary mt-2">Wyślij</button>
    <p class="small text-muted mt-2 mb-0">Każda propozycja trafia do akceptacji przez administratora, zanim wejdzie do gry.</p>
</form>

<table class="table table-sm bg-white shadow-sm">
    <thead>
        <tr>
            <th>Typ</th>
            <th>Tekst</th>
            <th>Status</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="p : ${proposals}">
            <td th:text="${p.type().name() == 'QUESTION'} ? 'Pytanie' : 'Odpowiedź'"></td>
            <td th:text="${p.text()}"></td>
            <td>
                <span class="badge bg-warning text-dark" th:if="${p.status().name() == 'PENDING'}">czeka</span>
                <span class="badge bg-success" th:if="${p.status().name() == 'APPROVED'}">zaakceptowana</span>
                <span th:if="${p.status().name() == 'REJECTED'}">
                    <span class="badge bg-danger">odrzucona</span>
                    <span class="small text-muted d-block" th:if="${p.reviewNote() != null}" th:text="${p.reviewNote()}"></span>
                </span>
            </td>
        </tr>
        <tr th:if="${proposals.isEmpty()}">
            <td colspan="3" class="text-muted text-center">Nie masz jeszcze żadnych propozycji.</td>
        </tr>
    </tbody>
</table>

</div>
</body>
</html>
