<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Propozycje kart — panel admina</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f5f7; }
    </style>
</head>
<body>
<div class="container py-4" style="max-width: 760px;">

<div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h4 mb-0">Propozycje kart od graczy</h1>
    <a href="/admin" class="btn btn-sm btn-outline-secondary">&larr; Dashboard</a>
</div>

<div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
<div class="alert alert-success" th:if="${info}" th:text="${info}"></div>

<div class="card shadow-sm mb-3" th:each="p : ${proposals}">
    <div class="card-body">
        <p class="text-muted small mb-1">
            <span th:text="${p.type().name() == 'QUESTION'} ? 'Pytanie' : 'Odpowiedź'"></span>
            &middot; zgłosił(a): <strong th:text="${p.proposerUsername()}"></strong>
        </p>
        <p class="card-text" th:text="${p.text()}"></p>

        <div class="d-flex gap-2 flex-wrap">
            <form method="post" th:action="@{/admin/proposals/{id}/approve(id=${p.id()})}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-sm btn-outline-success">Zaakceptuj</button>
            </form>

            <form method="post" th:action="@{/admin/proposals/{id}/reject(id=${p.id()})}" class="d-flex gap-1">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="text" name="note" class="form-control form-control-sm" placeholder="Powód odrzucenia (opcjonalnie)">
                <button type="submit" class="btn btn-sm btn-outline-danger">Odrzuć</button>
            </form>
        </div>
    </div>
</div>

<p class="text-muted text-center" th:if="${proposals.isEmpty()}">Brak propozycji do rozpatrzenia.</p>

</div>
</body>
</html>
