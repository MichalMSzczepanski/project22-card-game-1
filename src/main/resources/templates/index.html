<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Karciana Gra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f5f7; }
    </style>
</head>
<body>
<div class="container py-4" style="max-width: 480px;">

<nav class="d-flex justify-content-end small mb-2">
    <a th:href="@{/packs}">Pakiety</a>
</nav>

<h1 class="text-center mb-1">🃏 Karciana Gra</h1>
<p class="text-center text-muted small mb-4">Nie musisz być zabawny — musisz znać swoją ekipę. Zgadnij, kto napisał co 😏</p>

<div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
<div class="alert alert-success" th:if="${info}" th:text="${info}"></div>

<div class="card shadow-sm mb-3">
    <div class="card-body">
        <h2 class="card-title h5">Stwórz nową grę</h2>
        <form method="post" th:action="@{/games}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="text" class="form-control mb-3" name="nickname" placeholder="Twój nick" required th:maxlength="${maxNicknameLength}">

            <label class="form-label small text-muted mb-1" for="totalRounds">Liczba rund (ty jako twórca będziesz mógł/mogła wystartować grę)</label>
            <input type="number" id="totalRounds" class="form-control mb-3" name="totalRounds" min="1" th:max="${maxTotalRounds}" value="10">

            <p class="small text-muted">Darmowe pakiety zawsze w grze — <a th:href="@{/packs}">zobacz pakiety</a>.</p>

            <button type="submit" class="btn btn-primary btn-lg w-100">Stwórz grę</button>
        </form>
    </div>
</div>

<div class="card shadow-sm mb-3">
    <div class="card-body">
        <h2 class="card-title h5">Dołącz do gry</h2>
        <form method="post" th:action="@{/games/join}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="text" class="form-control mb-2 text-uppercase" name="code" placeholder="Kod gry" required th:maxlength="${codeLength}">
            <input type="text" class="form-control mb-3" name="nickname" placeholder="Twój nick" required th:maxlength="${maxNicknameLength}">
            <button type="submit" class="btn btn-outline-primary btn-lg w-100">Dołącz</button>
        </form>
    </div>
</div>

<p class="text-center text-muted small">Max <span th:text="${maxPlayers}"></span> graczy w pokoju.</p>
</div>
</body>
</html>
