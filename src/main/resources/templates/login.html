<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Logowanie</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f5f7; }
    </style>
</head>
<body>
<div class="container py-4" style="max-width: 420px;">
<h1 class="text-center mb-4">Logowanie</h1>

<div class="alert alert-danger" th:if="${param.error}">Błędny login lub hasło.</div>
<div class="alert alert-success" th:if="${info}" th:text="${info}"></div>

<div class="card shadow-sm">
    <div class="card-body">
        <form method="post" th:action="@{/login}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="text" class="form-control mb-2" name="username" placeholder="Login" required>
            <input type="password" class="form-control mb-3" name="password" placeholder="Hasło" required>
            <button type="submit" class="btn btn-primary btn-lg w-100">Zaloguj</button>
        </form>

        <form th:if="${googleEnabled}" method="get" th:action="@{/oauth2/authorization/google}" class="mt-2">
            <button type="submit" class="btn btn-outline-danger w-100">Zaloguj przez Google</button>
        </form>
    </div>
</div>

<p class="text-center mt-3 mb-1">Nie masz konta? <a th:href="@{/register}">Zarejestruj się</a></p>
<p class="text-center"><a th:href="@{/}">&larr; Wróć do gry bez logowania</a></p>
</div>
</body>
</html>
