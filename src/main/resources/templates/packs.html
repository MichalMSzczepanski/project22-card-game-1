<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pakiety kart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f4f5f7; }
    </style>
</head>
<body>
<div class="container py-4" style="max-width: 480px;">
<p><a th:href="@{/}">&larr; Wróć</a></p>
<h1 class="mb-3">Pakiety kart</h1>

<div class="card shadow-sm mb-3" th:each="pack : ${packs}">
    <div class="card-body d-flex justify-content-between align-items-center">
        <div>
            <strong th:text="${pack.name()}"></strong>
            <span class="badge bg-info text-dark ms-1" th:if="${pack.audience().name() == 'KIDS'}">dla dzieci</span>
            <span class="badge bg-dark ms-1" th:if="${pack.audience().name() == 'ADULT'}">18+</span>
        </div>
        <div>
            <span class="badge bg-success" th:if="${pack.free()}"><i class="bi bi-check-lg"></i> w grze</span>
            <span class="badge bg-secondary" th:unless="${pack.free()}">Tematyczne zestawy — wkrótce</span>
        </div>
    </div>
</div>

<p class="text-muted small">Na etapie darmowego MVP nie ma zakupów — płatne zestawy są w planach.</p>
</div>
</body>
</html>
