<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pakiety kart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f4f5f7; }
    </style>
</head>
<body>
<div class="container py-4" style="max-width: 480px;">
<p><a th:href="@{/}">&larr; Wróć</a></p>
<h1 class="mb-3">Pakiety kart</h1>
<div class="alert alert-success" th:if="${info}" th:text="${info}"></div>

<div class="card shadow-sm mb-3" th:each="pack : ${packs}">
    <div class="card-body d-flex justify-content-between align-items-center">
        <div>
            <strong th:text="${pack.name()}"></strong>
            <span class="badge bg-info text-dark ms-1" th:if="${pack.audience().name() == 'KIDS'}">dla dzieci</span>
            <span class="badge bg-dark ms-1" th:if="${pack.audience().name() == 'ADULT'}">18+</span>
            <div class="small text-muted">
                <span th:if="${pack.free()}">darmowy</span>
                <span th:unless="${pack.free()}" th:text="${pack.pricePln()} + ' zł'"></span>
            </div>
        </div>
        <div>
            <span class="badge bg-success" th:if="${pack.owned()}"><i class="bi bi-check-lg"></i> odblokowany</span>
            <span class="badge bg-secondary" th:if="${!pack.owned() and !pack.availableNow()}">oferta sezonowa — wkrótce</span>
            <form method="post" th:if="${!pack.owned() and pack.availableNow()}" th:action="@{/packs/{id}/purchase(id=${pack.id()})}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button th:if="${loggedIn}" type="submit" class="btn btn-sm btn-primary" th:text="'Kup za ' + ${pack.pricePln()} + ' zł'"></button>
                <a th:unless="${loggedIn}" class="btn btn-sm btn-outline-secondary" th:href="@{/login}">Zaloguj się, aby kupić</a>
            </form>
        </div>
    </div>
</div>

<p class="text-muted small">Płatność na etapie MVP jest symulowana — odblokowanie następuje natychmiast, bez realnego obciążenia karty.</p>
</div>
</body>
</html>
