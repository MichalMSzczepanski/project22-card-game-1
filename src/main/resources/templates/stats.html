<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Statystyki</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f5f7; }
    </style>
</head>
<body>
<div class="container py-4" style="max-width: 480px;">
<p><a th:href="@{/}">&larr; Wróć</a></p>
<h1 class="mb-3">Twoje statystyki</h1>

<div class="row text-center mb-4 g-2">
    <div class="col-4">
        <div class="card shadow-sm py-3">
            <div class="fs-4 fw-bold" th:text="${gamesPlayed}"></div>
            <div class="small text-muted">gier</div>
        </div>
    </div>
    <div class="col-4">
        <div class="card shadow-sm py-3">
            <div class="fs-4 fw-bold" th:text="${wins}"></div>
            <div class="small text-muted">zwycięstw</div>
        </div>
    </div>
    <div class="col-4">
        <div class="card shadow-sm py-3">
            <div class="fs-4 fw-bold" th:text="${#numbers.formatDecimal(avgPoints, 1, 1)}"></div>
            <div class="small text-muted">śr. pkt/gra</div>
        </div>
    </div>
</div>

<p th:if="${gamesPlayed == 0}" class="text-muted text-center">Jeszcze nie skończyłeś żadnej gry zalogowany — zagraj, żeby zobaczyć statystyki!</p>

<ul class="list-group" th:if="${gamesPlayed > 0}">
    <li class="list-group-item d-flex justify-content-between align-items-center" th:each="r : ${records}">
        <span>
            <span class="font-monospace" th:text="${r.gameId}"></span>
            <span class="badge bg-warning text-dark ms-1" th:if="${r.won}">🏆 wygrana</span>
        </span>
        <span th:text="${r.points} + ' pkt'"></span>
    </li>
</ul>
</div>
</body>
</html>
