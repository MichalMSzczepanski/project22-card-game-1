<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta th:if="${view.autoRefresh()}" http-equiv="refresh" content="3">
    <title>Karciana Gra — ekran</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #0f1020; color: #fff; min-height: 100vh; }
        .code { font-size: 4rem; font-weight: 800; letter-spacing: .3rem; }
        .black-card { background: #1a1a1a; border-radius: 1.5rem; padding: 2.5rem; font-size: 2.2rem; font-weight: 700; box-shadow: 0 1rem 2rem rgba(0,0,0,.4); }
        .scoreboard .list-group-item { background: transparent; color: #fff; font-size: 1.5rem; border-color: rgba(255,255,255,.15); }
        .leader-badge { color: #ffc107; }
        .pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
    </style>
</head>
<body class="d-flex align-items-center">
<div class="container py-4 text-center" style="max-width: 900px;">

    <div class="alert alert-secondary py-2" th:if="${view.justLeftNickname() != null}">
        <i class="bi bi-door-open"></i> <strong th:text="${view.justLeftNickname()}"></strong> opuścił(a) grę.
    </div>

    <div th:if="${view.status().name() == 'LOBBY'}">
        <p class="fs-3 mb-2">Dołącz kodem na swoim telefonie:</p>
        <div class="code mb-4" th:text="${view.gameId()}"></div>
        <p class="fs-4 text-white-50">Czekamy na graczy (<span th:text="${#lists.size(view.players())}"></span>)...</p>
        <ul class="list-group scoreboard mt-4">
            <li class="list-group-item" th:each="p : ${view.players()}" th:text="${p.nickname()}"></li>
        </ul>
    </div>

    <div th:unless="${view.status().name() == 'LOBBY' or view.status().name() == 'FINISHED'}">
        <span class="badge bg-secondary fs-4 mb-3">Runda <span th:text="${view.roundNumber()}"></span>/<span th:text="${view.totalRounds()}"></span></span>

        <div class="black-card mb-4" th:text="${view.questionCardText()}"></div>
        <p class="fs-5 text-white-50 mb-3" th:if="${view.status().name() == 'ANSWERING' or view.status().name() == 'RANKING'}">
            <i class="bi bi-stopwatch"></i> <span th:text="${view.secondsLeft()}"></span> s
        </p>

        <p class="fs-3 pulse" th:if="${view.status().name() == 'ANSWERING'}">
            <i class="bi bi-pencil-fill"></i> Odpowiedzi: <span th:text="${view.answeredCount()}"></span>/<span th:text="${view.answerersTotal()}"></span>
        </p>
        <p class="fs-3 pulse" th:if="${view.status().name() == 'RANKING'}">
            <i class="bi bi-sort-numeric-down"></i> Pozycje: <span th:text="${view.rankedCount()}"></span>/<span th:text="${view.ranksNeededTotal()}"></span>
        </p>

        <div th:if="${view.status().name() == 'REVEALED'}" class="text-start mt-3">
            <div class="card bg-dark text-white mb-2" th:each="row : ${view.reveal()}">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <div>
                        <p class="mb-1 fs-5"><em th:text="${row.cardText()}"></em></p>
                        <p class="mb-0 text-white-50">napisał(a): <strong th:text="${row.authorNickname()}"></strong></p>
                    </div>
                    <span class="badge bg-success fs-6" th:if="${row.rank() > 0}" th:text="'+' + ${row.points()} + ' pkt'"></span>
                </div>
            </div>
        </div>

        <ul class="list-group scoreboard mt-4">
            <li class="list-group-item d-flex justify-content-between" th:each="p : ${view.players()}">
                <span><i class="bi bi-mic-fill leader-badge" th:if="${p.leader()}"></i> <span th:text="${p.nickname()}"></span></span>
                <span th:text="${p.points()} + ' pkt'"></span>
            </li>
        </ul>
    </div>

    <div th:if="${view.status().name() == 'FINISHED'}">
        <div class="mb-2" style="font-size:4rem;">🏆</div>
        <p class="fs-2 mb-4">Wygrywa: <strong th:text="${#strings.listJoin(view.winnerNicknames(), ', ')}"></strong></p>
        <ul class="list-group scoreboard">
            <li class="list-group-item d-flex justify-content-between" th:each="p, iter : ${view.finalStandings()}">
                <span th:text="${iter.index + 1} + '. ' + ${p.nickname()}"></span>
                <span th:text="${p.points()} + ' pkt'"></span>
            </li>
        </ul>
    </div>

</div>
</body>
</html>
