<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Karty i pakiety — panel admina</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f5f7; }
    </style>
</head>
<body>
<div class="container py-4" style="max-width: 960px;">

<div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h4 mb-0">Karty i pakiety</h1>
    <a href="/admin" class="btn btn-sm btn-outline-secondary">&larr; Dashboard</a>
</div>

<div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
<div class="alert alert-success" th:if="${info}" th:text="${info}"></div>

<div class="row">
    <div class="col-md-4 mb-4">
        <h2 class="h6">Pakiety</h2>
        <div class="list-group mb-3 shadow-sm">
            <a th:each="p : ${view.packs()}" th:href="@{/admin/cards(packId=${p.id()})}"
               class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
               th:classappend="${view.selectedPack() != null and view.selectedPack().id() == p.id()} ? 'active' : ''">
                <span th:text="${p.name()}"></span>
                <span class="badge bg-secondary" th:text="${p.cardCount()}"></span>
            </a>
            <div class="list-group-item text-muted text-center" th:if="${view.packs().isEmpty()}">Brak pakietów.</div>
        </div>

        <h2 class="h6">Nowy pakiet</h2>
        <form method="post" action="/admin/packs" class="card card-body shadow-sm">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="text" name="name" class="form-control form-control-sm mb-2" placeholder="Nazwa" maxlength="100" required>
            <select name="audience" class="form-select form-select-sm mb-2">
                <option value="KIDS">Dla dzieci</option>
                <option value="FAMILY" selected>Rodzinny</option>
                <option value="ADULT">18+</option>
            </select>
            <div class="form-check mb-2">
                <input type="checkbox" name="free" value="true" class="form-check-input" id="newPackFree" checked>
                <label class="form-check-label small" for="newPackFree">Darmowy</label>
            </div>
            <input type="number" name="pricePln" step="0.01" min="0" class="form-control form-control-sm mb-2" placeholder="Cena (PLN)">
            <label class="small text-muted mb-0">Dostępny od</label>
            <input type="date" name="availableFrom" class="form-control form-control-sm mb-2">
            <label class="small text-muted mb-0">Dostępny do</label>
            <input type="date" name="availableUntil" class="form-control form-control-sm mb-2">
            <button type="submit" class="btn btn-sm btn-primary">Dodaj pakiet</button>
        </form>
    </div>

    <div class="col-md-8" th:if="${view.selectedPack() != null}">
        <h2 class="h6">Edycja pakietu: <span th:text="${view.selectedPack().name()}"></span></h2>
        <form method="post" th:action="@{/admin/packs/{id}(id=${view.selectedPack().id()})}"
              class="card card-body shadow-sm mb-4">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="row g-2">
                <div class="col-sm-6">
                    <input type="text" name="name" class="form-control form-control-sm" placeholder="Nazwa"
                           maxlength="100" th:value="${view.selectedPack().name()}" required>
                </div>
                <div class="col-sm-3">
                    <select name="audience" class="form-select form-select-sm">
                        <option value="KIDS" th:selected="${view.selectedPack().audience().name() == 'KIDS'}">Dla dzieci</option>
                        <option value="FAMILY" th:selected="${view.selectedPack().audience().name() == 'FAMILY'}">Rodzinny</option>
                        <option value="ADULT" th:selected="${view.selectedPack().audience().name() == 'ADULT'}">18+</option>
                    </select>
                </div>
                <div class="col-sm-3 form-check mt-2">
                    <input type="checkbox" name="free" value="true" class="form-check-input" id="editPackFree"
                           th:checked="${view.selectedPack().free()}">
                    <label class="form-check-label small" for="editPackFree">Darmowy</label>
                </div>
                <div class="col-sm-4">
                    <label class="small text-muted mb-0">Cena (PLN)</label>
                    <input type="number" name="pricePln" step="0.01" min="0" class="form-control form-control-sm"
                           th:value="${view.selectedPack().pricePln()}">
                </div>
                <div class="col-sm-4">
                    <label class="small text-muted mb-0">Dostępny od</label>
                    <input type="date" name="availableFrom" class="form-control form-control-sm"
                           th:value="${view.selectedPack().availableFrom()}">
                </div>
                <div class="col-sm-4">
                    <label class="small text-muted mb-0">Dostępny do</label>
                    <input type="date" name="availableUntil" class="form-control form-control-sm"
                           th:value="${view.selectedPack().availableUntil()}">
                </div>
            </div>
            <button type="submit" class="btn btn-sm btn-primary mt-2">Zapisz pakiet</button>
        </form>

        <h2 class="h6">Dodaj kartę</h2>
        <form method="post" action="/admin/cards" class="card card-body shadow-sm mb-3">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="hidden" name="packId" th:value="${view.selectedPack().id()}">
            <div class="row g-2">
                <div class="col-sm-8">
                    <input type="text" name="text" class="form-control form-control-sm" placeholder="Tekst karty"
                           maxlength="500" required>
                </div>
                <div class="col-sm-2">
                    <select name="type" class="form-select form-select-sm">
                        <option value="QUESTION">Pytanie</option>
                        <option value="ANSWER">Odpowiedź</option>
                    </select>
                </div>
                <div class="col-sm-2">
                    <button type="submit" class="btn btn-sm btn-primary w-100">Dodaj</button>
                </div>
            </div>
        </form>

        <h2 class="h6">Import z pliku (jedna karta na linię)</h2>
        <form method="post" action="/admin/cards/import" enctype="multipart/form-data" class="card card-body shadow-sm mb-4">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="hidden" name="packId" th:value="${view.selectedPack().id()}">
            <div class="row g-2">
                <div class="col-sm-6">
                    <input type="file" name="file" accept=".csv,.txt" class="form-control form-control-sm" required>
                </div>
                <div class="col-sm-3">
                    <select name="type" class="form-select form-select-sm">
                        <option value="QUESTION">Pytania</option>
                        <option value="ANSWER">Odpowiedzi</option>
                    </select>
                </div>
                <div class="col-sm-3">
                    <button type="submit" class="btn btn-sm btn-outline-primary w-100">Importuj</button>
                </div>
            </div>
        </form>

        <h2 class="h6">Karty (<span th:text="${view.cards().size()}"></span>)</h2>
        <table class="table table-sm bg-white shadow-sm align-middle">
            <thead>
                <tr>
                    <th>Typ</th>
                    <th>Tekst</th>
                    <th>Stan</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="c : ${view.cards()}" th:classappend="${!c.enabled()} ? 'text-muted' : ''">
                    <td th:text="${c.type().name() == 'QUESTION'} ? 'Pytanie' : 'Odpowiedź'"></td>
                    <td>
                        <form method="post" th:action="@{/admin/cards/{id}(id=${c.id()})}" class="d-flex gap-1">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <input type="hidden" name="packId" th:value="${view.selectedPack().id()}">
                            <input type="hidden" name="type" th:value="${c.type()}">
                            <input type="text" name="text" th:value="${c.text()}" maxlength="500"
                                   class="form-control form-control-sm" required>
                            <button type="submit" class="btn btn-sm btn-outline-secondary">Zapisz</button>
                        </form>
                    </td>
                    <td th:text="${c.enabled()} ? 'włączona' : 'wyłączona'"></td>
                    <td>
                        <form method="post" th:action="@{/admin/cards/{id}/toggle(id=${c.id()})}">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <input type="hidden" name="packId" th:value="${view.selectedPack().id()}">
                            <input type="hidden" name="enabled" th:value="${!c.enabled()}">
                            <button type="submit" class="btn btn-sm btn-outline-warning"
                                    th:text="${c.enabled()} ? 'Wyłącz' : 'Włącz'"></button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${view.cards().isEmpty()}">
                    <td colspan="4" class="text-muted text-center">Ten pakiet nie ma jeszcze kart.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</div>
</body>
</html>
