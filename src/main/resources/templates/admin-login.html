<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Panel admina — logowanie</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #1a1a2e; }
    </style>
</head>
<body>
<div class="container py-5" style="max-width: 380px;">
<h1 class="text-center text-white mb-4 h4">Panel admina</h1>

<div class="alert alert-danger" th:if="${param.error}">Błędny login lub hasło.</div>

<div class="card shadow-sm">
    <div class="card-body">
        <form method="post" th:action="@{/admin/login}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="text" class="form-control mb-2" name="username" placeholder="Login" required>
            <input type="password" class="form-control mb-3" name="password" placeholder="Hasło" required>
            <button type="submit" class="btn btn-dark w-100">Zaloguj</button>
        </form>
    </div>
</div>
</div>
</body>
</html>
